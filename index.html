      width: 100%;

      height: 100dvh;
      max-height: 100dvh;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
    }
    #app {
      width: 100%;
      max-width: 100%;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
    }
    @media (max-width: 768px) {
      input, textarea, select {
        font-size: 16px !important;
      }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(130, 142, 158, 0.35); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(130, 142, 158, 0.55); }
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;

       ========================================================================== */
    :root {
      --app-canvas: #f1f0ec;
      --app-surface: #faf9f6;
      --app-subtle: #f3f1ed;
      --app-muted: #e6e4df;
      --app-border: #dad6ce;
      --app-text: #2c3138;
      --app-text-muted: #6b727d;

      --ash-primary: #577087;
      --ash-primary-hover: #496075;

      --ash-bg: #e3ebf2;
      --ash-text: #3a5269;
      --ash-border: #c5d5e3;

      --sage-bg: #e2eee9;
      --sage-text: #38574e;
      --sage-border: #c1d8cf;

      --rose-bg: #f2e4e7;
      --rose-text: #6b424c;
      --rose-border: #dfc5cb;

      --mauve-bg: #eae6f2;
      --mauve-text: #4d4666;
      --mauve-border: #cfc9df;

      --sand-bg: #f1eae0;

      --terra-bg: #f3e6e1;

      --mint-bg: #e0eef0;
      --mint-text: #35585c;
      --mint-border: #bed8dc;
    }

      --app-canvas: #161920;

      --rose-border: rgba(180, 128, 141, 0.34);

      --mauve-bg: rgba(128, 118, 162, 0.21);
      --mauve-text: #cfc9e6;
      --mauve-border: rgba(146, 136, 180, 0.34);

      --sand-bg: rgba(158, 134, 102, 0.21);
      --sand-text: #e2d1b8;
      --sand-border: rgba(176, 152, 118, 0.34);

      --terra-bg: rgba(166, 120, 104, 0.21);

      --terra-border: rgba(184, 138, 122, 0.34);

      --mint-bg: rgba(92, 138, 144, 0.21);
      --mint-text: #b8dce0;
      --mint-border: rgba(112, 158, 164, 0.34);
    }

    .bg-app-surface { background-color: var(--app-surface); color: var(--app-text); }

    .bg-app-muted { background-color: var(--app-muted); }
    .border-app { border-color: var(--app-border); }
    .text-app-main { color: var(--app-text); }
    .text-app-muted { color: var(--app-text-muted); }

    .btn-ash {
      background-color: var(--ash-primary);
      color: #ffffff;
      transition: all 0.18s ease;
    }
    .btn-ash:hover {
      background-color: var(--ash-primary-hover);
    }

    .btn-sage {
      background-color: #5a7a70;
      color: #ffffff;
      transition: all 0.18s ease;
    }
    .btn-sage:hover {
      background-color: #698b80;
    }

    .btn-rose {
      background-color: #87606b;
      color: #ffffff;
      transition: all 0.18s ease;
    }
    .btn-rose:hover {
      background-color: #986f7b;
    }

      background-color: var(--ash-bg);
      color: var(--ash-text);
      border: 1px solid var(--ash-border);
    }
    .badge-sage {
      background-color: var(--sage-bg);
      color: var(--sage-text);
      border: 1px solid var(--sage-border);

    .badge-rose {

    .badge-mauve {

    .badge-sand {

    .badge-terra {

    function mergeCommunityObjects(c1, c2) {
      const memMap = new Map();
      for (const m of [...(c1.members || []), ...(c2.members || [])]) {
        if (m && m.userId) memMap.set(m.userId, m);
      }
      const kickedSet = new Set([...(c1.kickedUserIds || []), ...(c2.kickedUserIds || [])]);
      const mergedMembers = Array.from(memMap.values()).filter((m) => !kickedSet.has(m.userId));
      return {
        ...c1,
        ...c2,
        members: mergedMembers,
        kickedUserIds: Array.from(kickedSet),
        memberCount: Math.max(1, mergedMembers.length)
      };
    }

    function mergeMessageArrays(arr1, arr2, deletedIdSet) {
      const map = new Map();
      for (const m of [...(Array.isArray(arr1) ? arr1 : []), ...(Array.isArray(arr2) ? arr2 : [])]) {
        if (!m || !m.id) continue;
        if (deletedIdSet && deletedIdSet.has(m.id)) continue;
        const prev = map.get(m.id);
        if (prev) {
          const readSet = new Set([...(prev.readUserIds || []), ...(m.readUserIds || []), m.senderId].filter(Boolean));
          map.set(m.id, { ...prev, ...m, readUserIds: Array.from(readSet) });
        } else {
          map.set(m.id, m);
        }
      }
      return Array.from(map.values()).sort((a, b) => {
        const tA = a.createdAt ? new Date(a.createdAt).getTime() : 0;
        const tB = b.createdAt ? new Date(b.createdAt).getTime() : 0;
        return tA - tB;
      });
    }

    const processedEventIds = new Set();

    function handleIncomingRealtimeEvent(data) {
      const { type, payload, eventId } = data || {};
      if (eventId) {
        if (processedEventIds.has(eventId)) return;
        processedEventIds.add(eventId);
        if (processedEventIds.size > 1500) {
          const first = processedEventIds.values().next().value;
          processedEventIds.delete(first);
        }
      }
      let needsUpdate = false;

      if (type === "NEW_MESSAGE" && payload && payload.communityId) {
        const cid = payload.communityId;
        const curList = state.messagesByComm[cid] || [];
        // 방 단위 수신 보장: 현재 입장해 있는 방이거나 이미 참여한 방의 메시지만 처리
        if (curList.some((m) => m.id === payload.id)) {
          return;
        }
        const nextList = mergeMessageArrays(curList, [payload]);
        if (state.activeCommunityId === cid && state.currentUser) {
          nextList.forEach((m) => {
            if (!Array.isArray(m.readUserIds)) m.readUserIds = [m.senderId];
            if (!m.readUserIds.includes(state.currentUser.id)) {
              m.readUserIds.push(state.currentUser.id);
            }
          });
        }
        state.messagesByComm[cid] = nextList;
        saveStorage(STORAGE_KEYS.MESSAGES, state.messagesByComm);
        needsUpdate = true;
      } else if (type === "ROOM_READ_ACK" && payload && payload.communityId && payload.userId) {
        const cid = payload.communityId;
        const curList = state.messagesByComm[cid] || [];
        let ackChanged = false;
        curList.forEach((m) => {
          if (!Array.isArray(m.readUserIds)) m.readUserIds = [m.senderId];
          if (!m.readUserIds.includes(payload.userId)) {
            m.readUserIds.push(payload.userId);
            ackChanged = true;
          }
        });
        if (ackChanged) {
          saveStorage(STORAGE_KEYS.MESSAGES, state.messagesByComm);
          needsUpdate = true;
        }
      } else if (type === "MESSAGE_DELETED" && payload) {
        const { communityId, messageId } = payload;
        if (communityId && messageId) {
          state.messagesByComm[communityId] = (state.messagesByComm[communityId] || []).filter((m) => m.id !== messageId);
          saveStorage(STORAGE_KEYS.MESSAGES, state.messagesByComm);
          needsUpdate = true;
        }
      } else if ((type === "COMMUNITY_UPDATED" || type === "NEW_COMMUNITY") && payload && payload.id) {
        const idx = state.communities.findIndex((c) => c.id === payload.id);
        if (idx >= 0) {
          state.communities[idx] = mergeCommunityObjects(state.communities[idx], payload);
        } else if (!state.deletedCommIds.includes(payload.id)) {
          state.communities.unshift(payload);
        }
        saveStorage(STORAGE_KEYS.COMMUNITIES, state.communities);
        needsUpdate = true;
      } else if (type === "COMMUNITY_DELETED" && payload) {
        const commId = payload;
        state.communities = state.communities.filter((c) => c.id !== commId);
        if (!state.deletedCommIds.includes(commId)) state.deletedCommIds.push(commId);
        if (state.activeCommunityId === commId) {
          roomSocket.leaveRoom(commId);
          state.activeCommunityId = null;
        }
        saveStorage(STORAGE_KEYS.COMMUNITIES, state.communities);
        saveStorage(STORAGE_KEYS.DELETED_COMMS, state.deletedCommIds);
        needsUpdate = true;
      } else if (type === "NEW_DM" && payload && payload.convId) {
        const curDms = state.dms[payload.convId] || [];
        if (payload.message && curDms.some((m) => m.id === payload.message.id)) {
          return;
        }
        state.dms[payload.convId] = mergeMessageArrays(curDms, [payload.message]);
        saveStorage(STORAGE_KEYS.DMS, state.dms);
        needsUpdate = true;
      } else {
        // Fallback full storage reload
        state.usersDir = loadAndRestoreUsersDirectory();
        state.communities = loadCleanCommunities();
        state.messagesByComm = loadCleanMessages();
        state.posts = loadCleanPosts();
        state.follows = loadCleanFollows();
        state.dms = loadStorage(STORAGE_KEYS.DMS, {});
        needsUpdate = true;
      }

      if (needsUpdate) {
        safeReactiveRender(true);
      }
    }

    // ============================================================================
    // Room-Scoped Bidirectional WebSocket Client (MQTT-over-WSS, 무설치 실시간 양방향 소켓)
    // - 방(Room) 단위 토픽 구독/브로드캐스팅 (joinRoom / leaveRoom / publishToRoom)
    // - 네트워크 단절 시 지수 백오프 자동 재연결 + 25초 하트비트
    // - 페이지 이탈 시 DISCONNECT 전송 및 소켓 해제
    // ============================================================================
    class RoomWebSocketClient {
      constructor() {
        this.ws = null;
        this.connected = false;
        this.manuallyClosed = false;
        this.reconnectAttempts = 0;
        this.reconnectTimer = null;
        this.pingTimer = null;
        this.packetId = 1;
        this.activeRoomId = null;
        this.clientId = "ah_" + Math.random().toString(36).slice(2, 10) + "_" + Date.now().toString(36);
        this.encoder = new TextEncoder();
        this.decoder = new TextDecoder();
        this.rxBuffer = new Uint8Array(0);
      }

      nextPacketId() {
        this.packetId = (this.packetId % 65535) + 1;
        return this.packetId;
      }

      encodeUtf8Str(str) {
        const bytes = this.encoder.encode(str);
        const out = new Uint8Array(2 + bytes.length);
        out[0] = (bytes.length >> 8) & 0xff;
        out[1] = bytes.length & 0xff;
        out.set(bytes, 2);
        return out;
      }

      encodeRemainingLength(len) {
        const bytes = [];
        do {
          let digit = len % 128;
          len = Math.floor(len / 128);
          if (len > 0) digit |= 0x80;
          bytes.push(digit);
        } while (len > 0);
        return new Uint8Array(bytes);
      }

      buildPacket(headerByte, bodyParts) {
        let total = 0;
        for (const p of bodyParts) total += p.length;
        const rem = this.encodeRemainingLength(total);
        const pkt = new Uint8Array(1 + rem.length + total);
        pkt[0] = headerByte;
        pkt.set(rem, 1);
        let offset = 1 + rem.length;
        for (const p of bodyParts) {
          pkt.set(p, offset);
          offset += p.length;
        }
        return pkt;
      }

      connect() {
        if (this.ws && (this.ws.readyState === WebSocket.OPEN || this.ws.readyState === WebSocket.CONNECTING)) {
          return;
        }
        this.manuallyClosed = false;
        try {
          this.ws = new WebSocket("wss://broker.emqx.io:8084/mqtt", "mqtt");
          this.ws.binaryType = "arraybuffer";

          this.ws.onopen = () => {
            this.connected = false;
            this.rxBuffer = new Uint8Array(0);
            // MQTT v3.1.1 CONNECT packet
            const proto = this.encodeUtf8Str("MQTT");
            const flags = new Uint8Array([0x04, 0x02, 0x00, 0x3c]); // level 4, cleanSession=1, keepAlive=60s
            const cid = this.encodeUtf8Str(this.clientId);
            this.ws.send(this.buildPacket(0x10, [proto, flags, cid]));
          };

          this.ws.onmessage = (evt) => {
            const chunk = new Uint8Array(evt.data);
            const merged = new Uint8Array(this.rxBuffer.length + chunk.length);
            merged.set(this.rxBuffer, 0);
            merged.set(chunk, this.rxBuffer.length);
            this.rxBuffer = merged;
            this.parseIncomingPackets();
          };

          this.ws.onclose = () => {
            this.connected = false;
            this.stopHeartbeat();
            if (!this.manuallyClosed) {
              this.scheduleReconnect();
            }
          };

          this.ws.onerror = () => {
            try { this.ws.close(); } catch (e) {}
          };
        } catch (e) {
          this.scheduleReconnect();
        }
      }

      parseIncomingPackets() {
        while (this.rxBuffer.length >= 2) {
          const type = this.rxBuffer[0] & 0xf0;
          let multiplier = 1;
          let remLen = 0;
          let idx = 1;
          let encodedByte = 0;
          let incomplete = false;
          do {
            if (idx >= this.rxBuffer.length) { incomplete = true; break; }
            encodedByte = this.rxBuffer[idx++];
            remLen += (encodedByte & 127) * multiplier;
            multiplier *= 128;
          } while ((encodedByte & 128) !== 0);

          if (incomplete || this.rxBuffer.length < idx + remLen) break;

          const payloadStart = idx;
          const packetEnd = idx + remLen;
          const body = this.rxBuffer.slice(payloadStart, packetEnd);
          this.rxBuffer = this.rxBuffer.slice(packetEnd);

          if (type === 0x20) {
            // CONNACK
            this.connected = true;
            this.reconnectAttempts = 0;
            this.startHeartbeat();
            this.subscribeTopic("alterhuman/lounge/v2/lobby");
            if (this.activeRoomId) {
              this.subscribeTopic(`alterhuman/lounge/v2/room/${this.activeRoomId}`);
            }
          } else if (type === 0x30) {
            // PUBLISH
            const qos = (this.rxBuffer[0] || 0) & 0x06;
            if (body.length >= 2) {
              const topicLen = (body[0] << 8) | body[1];
              let pos = 2 + topicLen;
              if (qos > 0) pos += 2;
              if (pos <= body.length) {
                const jsonStr = this.decoder.decode(body.slice(pos));
                try {
                  const data = JSON.parse(jsonStr);
                  if (data && data.senderClientId !== this.clientId) {
                    handleIncomingRealtimeEvent(data);
                  }
                } catch (e) {}
              }
            }
          }
        }
      }

      startHeartbeat() {
        this.stopHeartbeat();
        this.pingTimer = setInterval(() => {
          if (this.ws && this.ws.readyState === WebSocket.OPEN) {
            this.ws.send(new Uint8Array([0xc0, 0x00])); // PINGREQ
          }
        }, 25000);
      }

      stopHeartbeat() {
        if (this.pingTimer) {
          clearInterval(this.pingTimer);
          this.pingTimer = null;
        }
      }

      scheduleReconnect() {
        if (this.reconnectTimer || this.manuallyClosed) return;
        const delay = Math.min(15000, 1200 * Math.pow(1.5, this.reconnectAttempts));
        this.reconnectAttempts++;
        this.reconnectTimer = setTimeout(() => {
          this.reconnectTimer = null;
          this.connect();
        }, delay);
      }

      subscribeTopic(topic) {
        if (!this.ws || this.ws.readyState !== WebSocket.OPEN || !this.connected) return;
        const pid = this.nextPacketId();
        const pidBytes = new Uint8Array([(pid >> 8) & 0xff, pid & 0xff]);
        const tBytes = this.encodeUtf8Str(topic);
        const qosByte = new Uint8Array([0x00]);
        this.ws.send(this.buildPacket(0x82, [pidBytes, tBytes, qosByte]));
      }

      unsubscribeTopic(topic) {
        if (!this.ws || this.ws.readyState !== WebSocket.OPEN || !this.connected) return;
        const pid = this.nextPacketId();
        const pidBytes = new Uint8Array([(pid >> 8) & 0xff, pid & 0xff]);
        const tBytes = this.encodeUtf8Str(topic);
        this.ws.send(this.buildPacket(0xa2, [pidBytes, tBytes]));
      }

      publishTopic(topic, type, payload) {
        if (!this.ws || this.ws.readyState !== WebSocket.OPEN || !this.connected) return;
        const tBytes = this.encodeUtf8Str(topic);
        const msgObj = {
          type,
          payload,
          senderClientId: this.clientId,
          eventId: `${this.clientId}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`
        };
        const pBytes = this.encoder.encode(JSON.stringify(msgObj));
        this.ws.send(this.buildPacket(0x30, [tBytes, pBytes]));
      }

      joinRoom(roomId) {
        if (!roomId) return;
        if (this.activeRoomId && this.activeRoomId !== roomId) {
          this.unsubscribeTopic(`alterhuman/lounge/v2/room/${this.activeRoomId}`);
        }
        this.activeRoomId = roomId;
        this.subscribeTopic(`alterhuman/lounge/v2/room/${roomId}`);
        if (state.currentUser) {
          this.publishTopic(`alterhuman/lounge/v2/room/${roomId}`, "ROOM_READ_ACK", {
            communityId: roomId,
            userId: state.currentUser.id
          });
        }
      }

      leaveRoom(roomId) {
        const target = roomId || this.activeRoomId;
        if (target) {
          this.unsubscribeTopic(`alterhuman/lounge/v2/room/${target}`);
        }
        if (this.activeRoomId === target) {
          this.activeRoomId = null;
        }
      }

      disconnect() {
        this.manuallyClosed = true;
        this.stopHeartbeat();
        if (this.reconnectTimer) {
          clearTimeout(this.reconnectTimer);
          this.reconnectTimer = null;
        }
        if (this.ws) {
          try {
            if (this.ws.readyState === WebSocket.OPEN) {
              this.ws.send(new Uint8Array([0xe0, 0x00])); // MQTT DISCONNECT
            }
            this.ws.close();
          } catch (e) {}
          this.ws = null;
        }
        this.connected = false;
      }
    }

    const roomSocket = new RoomWebSocketClient();
    roomSocket.connect();

    // 페이지 이탈 시 소켓 연결 정상 해제 (Disconnect)
    window.addEventListener("beforeunload", () => roomSocket.disconnect());
    window.addEventListener("pagehide", () => roomSocket.disconnect());

    if (bcChannel) {
      bcChannel.onmessage = (event) => {
        handleIncomingRealtimeEvent(event.data);
      };
    }

    // 동일 브라우저 내 다른 탭/창에서 localStorage 변경 시 즉시 반응
    window.addEventListener("storage", (e) => {
      if (!e.key) return;
      if (
        e.key === STORAGE_KEYS.COMMUNITIES ||
        e.key === STORAGE_KEYS.MESSAGES ||
        e.key === STORAGE_KEYS.USERS_DIR ||
        e.key === STORAGE_KEYS.DMS ||
        e.key === STORAGE_KEYS.POSTS
      ) {
        handleIncomingRealtimeEvent({ type: "STORAGE_SYNC" });
      }
    });

    function broadcastEvent(type, payload) {
      const eventId = `bc_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
      if (bcChannel) {
        try { bcChannel.postMessage({ type, payload, eventId, t: Date.now() }); } catch (e) {}
      }
      // 방 단위 메시지/삭제/읽음 이벤트는 해당 방 토픽으로만 브로드캐스팅, 커뮤니티 목록/DM/유저는 로비 토픽으로 브로드캐스팅
      if ((type === "NEW_MESSAGE" || type === "MESSAGE_DELETED" || type === "ROOM_READ_ACK") && payload && payload.communityId) {
        roomSocket.publishTopic(`alterhuman/lounge/v2/room/${payload.communityId}`, type, payload);
      } else if (type === "COMMUNITY_UPDATED" && payload && payload.id) {
        roomSocket.publishTopic(`alterhuman/lounge/v2/room/${payload.id}`, type, payload);
        roomSocket.publishTopic("alterhuman/lounge/v2/lobby", type, payload);
      } else {
        roomSocket.publishTopic("alterhuman/lounge/v2/lobby", type, payload);
      }
    }

    async function cloudGet(key, fallback) {
      try {
        const res = await fetch(`${CLOUD_API_BASE}/${key}?_t=${Date.now()}`, { cache: "no-store" });
        if (res.ok) {
          state.cloudConnected = true;
          return await res.json();
        }
      } catch (e) {}
      return fallback;
    }

    async function cloudPut(key, data) {
      try {
        await fetch(`${CLOUD_API_BASE}/${key}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        state.cloudConnected = true;
      } catch (e) {}
    }

    // 방별 실시간 메시지 원자적(Atomic) 저장: 클라우드의 최신 메시지와 병합 후 저장하여 다른 사람의 메시지가 덮어써지지 않도록 보장
    async function cloudSaveRoomMessages(commId, localRoomMsgs, deletedMsgId) {
      const roomKey = CLOUD_KEYS.ROOM_MSG_PREFIX + commId;
      const cloudRoomMsgs = await cloudGet(roomKey, []);
      const deletedSet = deletedMsgId ? new Set([deletedMsgId]) : null;
      const merged = mergeMessageArrays(cloudRoomMsgs, localRoomMsgs, deletedSet);
      state.messagesByComm[commId] = merged;
      saveStorage(STORAGE_KEYS.MESSAGES, state.messagesByComm);
      await cloudPut(roomKey, merged);
      await cloudPut(CLOUD_KEYS.MESSAGES, state.messagesByComm);
      return merged;
    }

    // 커뮤니티 목록 원자적(Atomic) 저장: 다른 계정이 방에 입장하거나 새 방을 만들었을 때 클라우드 최신 멤버 목록과 병합 후 저장
    async function cloudSaveCommunities() {
      const cloudComms = await cloudGet(CLOUD_KEYS.COMMUNITIES, []);
      const commMap = new Map();
      for (const c of [...(Array.isArray(cloudComms) ? cloudComms : []), ...state.communities]) {
        if (c && c.id && !AI_SEED_COMM_IDS.includes(c.id) && !state.deletedCommIds.includes(c.id)) {
          const prev = commMap.get(c.id);
          commMap.set(c.id, prev ? mergeCommunityObjects(prev, c) : c);
        }
      }
      const mergedComms = Array.from(commMap.values());
      state.communities = mergedComms;
      saveStorage(STORAGE_KEYS.COMMUNITIES, mergedComms);
      await cloudPut(CLOUD_KEYS.COMMUNITIES, mergedComms);
      return mergedComms;
    }

    // 키보드 포커스를 절대 잃지 않으면서 채팅 메시지, 참여자 목록, 헤더 인원수, 로비 카드를 실시간 갱신
    function safeReactiveRender(autoScrollIfNearBottom = false) {
      const activeEl = document.activeElement;
      const activeId = activeEl ? activeEl.id : "";
      const isInputFocused = activeEl && ["INPUT", "TEXTAREA", "SELECT"].includes((activeEl.tagName || "").toUpperCase());

      // 채팅방 안에서 입력창에 포커스가 있을 때: 입력창 DOM은 건드리지 않고 메시지 스트림, 참여자 사이드바, 상단 인원수를 모두 실시간 업데이트!
      if (isInputFocused && activeId === "chat-msg-input" && state.activeCommunityId) {
        const box = document.getElementById("chat-scroll-box");
        if (box) {
          const wasNearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 140;
          box.innerHTML = renderChatMessagesInnerHtml();
          if (wasNearBottom || autoScrollIfNearBottom) box.scrollTop = box.scrollHeight;
        }
        const membersBox = document.getElementById("chat-members-list-box");
        if (membersBox) {
          membersBox.innerHTML = renderChatMembersListInnerHtml();
        }
        const comm = state.communities.find((c) => c.id === state.activeCommunityId);
        if (comm) {
          const cnt = Math.max((comm.members || []).length, 1);
          const headerCntEl = document.getElementById("chat-header-member-count");
          if (headerCntEl) headerCntEl.textContent = `· 접속 ${cnt}/${cnt}명`;
          const btnCntEl = document.getElementById("chat-btn-member-count");
          if (btnCntEl) btnCntEl.textContent = `멤버 (${cnt})`;
          const sideCntEl = document.getElementById("chat-sidebar-member-count");
          if (sideCntEl) sideCntEl.textContent = `참여자 목록 (${cnt}명)`;
        }
        return;
      }

      if (isInputFocused && activeId === "dm-msg-input" && state.activeDmUser) {
        const dmBox = document.getElementById("dm-scroll-box");
        if (dmBox) {
          dmBox.innerHTML = renderDmMessagesInnerHtml();
          dmBox.scrollTop = dmBox.scrollHeight;
        }
        return;
      }

      if (isInputFocused) {
        return;
      }

      render();
      if (autoScrollIfNearBottom && state.activeCommunityId) {
        const box = document.getElementById("chat-scroll-box");
        if (box) box.scrollTop = box.scrollHeight;
      }
    }

    let isSyncingCloud = false;
    async function syncWithCloud() {
      if (isSyncingCloud) return;
      isSyncingCloud = true;
      try {
        let changed = false;

        // 1. Deleted community tombstones
        const cloudDeleted = await cloudGet(CLOUD_KEYS.DELETED_COMMS, []);
        if (Array.isArray(cloudDeleted)) {
          const mergedDeleted = Array.from(new Set([...state.deletedCommIds, ...cloudDeleted]));
          if (mergedDeleted.length !== state.deletedCommIds.length) {
            state.deletedCommIds = mergedDeleted;
            saveStorage(STORAGE_KEYS.DELETED_COMMS, mergedDeleted);
            changed = true;
          }
        }

        // 2. Users Directory
        const cloudUsers = await cloudGet(CLOUD_KEYS.USERS, null);
        if (cloudUsers && typeof cloudUsers === "object") {
          const prevJson = JSON.stringify(state.usersDir);
          const mergedUsers = { ...state.usersDir };
          for (const [k, cu] of Object.entries(cloudUsers)) {
            if (cu && cu.username && !isChamchiGimbapAccount(cu, null)) {
              const nk = cu.username.trim().toLowerCase();
              mergedUsers[nk] = { ...cu, ...(state.usersDir[nk] || {}), username: nk };
            }
          }
          mergedUsers["loon"] = {
            ...PERMANENT_LOON_ACCOUNT,
            ...(mergedUsers["loon"] || {}),
            username: "loon",
            password: (mergedUsers["loon"] && mergedUsers["loon"].password) || "1022",
            name: (mergedUsers["loon"] && mergedUsers["loon"].name) || "우엉김밥"
          };
          if (JSON.stringify(mergedUsers) !== prevJson) {
            state.usersDir = mergedUsers;
            saveStorage(STORAGE_KEYS.USERS_DIR, mergedUsers);
            changed = true;
          }
          if (Object.keys(mergedUsers).length > Object.keys(cloudUsers).length) {
            await cloudPut(CLOUD_KEYS.USERS, mergedUsers);
          }
        } else {
          await cloudPut(CLOUD_KEYS.USERS, state.usersDir);
        }

        // 3. Communities & Members (다른 계정이 방에 들어오거나 방을 만들었을 때 실시간 반영)
        const cloudComms = await cloudGet(CLOUD_KEYS.COMMUNITIES, null);
        if (Array.isArray(cloudComms)) {
          const prevCommsJson = JSON.stringify(state.communities);
          const commMap = new Map();
          for (const c of [...cloudComms, ...state.communities]) {
            if (c && c.id && !AI_SEED_COMM_IDS.includes(c.id) && !state.deletedCommIds.includes(c.id)) {
              const existing = commMap.get(c.id);
              commMap.set(c.id, existing ? mergeCommunityObjects(existing, c) : c);
            }
          }
          const mergedComms = Array.from(commMap.values());
          if (JSON.stringify(mergedComms) !== prevCommsJson) {
            state.communities = mergedComms;
            saveStorage(STORAGE_KEYS.COMMUNITIES, mergedComms);
            changed = true;
          }
          if (JSON.stringify(mergedComms) !== JSON.stringify(cloudComms)) {
            await cloudPut(CLOUD_KEYS.COMMUNITIES, mergedComms);
          }
        } else if (state.communities.length > 0) {
          await cloudPut(CLOUD_KEYS.COMMUNITIES, state.communities);
        }

        // 4. Active Room Messages (현재 들어가 있는 커뮤니티 방의 메시지를 최우선으로 실시간 동기화 + 읽음 숫자 실시간 차감)
        if (state.activeCommunityId && !state.deletedCommIds.includes(state.activeCommunityId)) {
          const cid = state.activeCommunityId;
          const roomKey = CLOUD_KEYS.ROOM_MSG_PREFIX + cid;
          const cloudRoomMsgs = await cloudGet(roomKey, null);
          if (Array.isArray(cloudRoomMsgs)) {
            const localList = state.messagesByComm[cid] || [];
            const prevRoomJson = JSON.stringify(localList);
            const mergedRoom = mergeMessageArrays(localList, cloudRoomMsgs);

            let readUpdated = false;
            if (state.currentUser) {
              mergedRoom.forEach((m) => {
                if (!Array.isArray(m.readUserIds)) m.readUserIds = [m.senderId];
                if (!m.readUserIds.includes(state.currentUser.id)) {
                  m.readUserIds.push(state.currentUser.id);
                  readUpdated = true;
                }
              });
            }

            if (JSON.stringify(mergedRoom) !== prevRoomJson || readUpdated) {
              state.messagesByComm[cid] = mergedRoom;
              saveStorage(STORAGE_KEYS.MESSAGES, state.messagesByComm);
              changed = true;
            }
            if (readUpdated || mergedRoom.length > cloudRoomMsgs.length) {
              await cloudPut(roomKey, mergedRoom);
            }
          } else if ((state.messagesByComm[cid] || []).length > 0) {
            await cloudPut(roomKey, state.messagesByComm[cid]);
          }
        }

        // 5. All Communities Messages Map
        const cloudMsgs = await cloudGet(CLOUD_KEYS.MESSAGES, null);
        if (cloudMsgs && typeof cloudMsgs === "object") {
          const prevMsgsJson = JSON.stringify(state.messagesByComm);
          const mergedMsgs = { ...state.messagesByComm };
          for (const [cid, list] of Object.entries(cloudMsgs)) {
            if (AI_SEED_COMM_IDS.includes(cid) || state.deletedCommIds.includes(cid)) continue;
            mergedMsgs[cid] = mergeMessageArrays(mergedMsgs[cid] || [], Array.isArray(list) ? list : []);
          }
          if (JSON.stringify(mergedMsgs) !== prevMsgsJson) {
            state.messagesByComm = mergedMsgs;
            saveStorage(STORAGE_KEYS.MESSAGES, mergedMsgs);
            changed = true;
          }
        }

        // 6. Posts & DMs
        const cloudPosts = await cloudGet(CLOUD_KEYS.POSTS, null);
        if (Array.isArray(cloudPosts)) {
          const postMap = new Map();
          for (const p of [...cloudPosts, ...state.posts]) {
            if (p && p.id && !AI_BOT_USER_IDS.includes(p.authorId)) postMap.set(p.id, p);
          }
          const mergedPosts = Array.from(postMap.values());
          if (JSON.stringify(mergedPosts) !== JSON.stringify(state.posts)) {
            state.posts = mergedPosts;
            saveStorage(STORAGE_KEYS.POSTS, mergedPosts);
            changed = true;
          }
        }

        const cloudDms = await cloudGet(CLOUD_KEYS.DMS, null);
        if (cloudDms && typeof cloudDms === "object") {
          const prevDmsJson = JSON.stringify(state.dms);
          const mergedDms = { ...state.dms };
          for (const [convId, list] of Object.entries(cloudDms)) {
            mergedDms[convId] = mergeMessageArrays(mergedDms[convId] || [], Array.isArray(list) ? list : []);
          }
          if (JSON.stringify(mergedDms) !== prevDmsJson) {
            state.dms = mergedDms;
            saveStorage(STORAGE_KEYS.DMS, mergedDms);
            changed = true;
          }
        }

        if (changed) {
          safeReactiveRender(true);
        }
      } catch (e) {
      } finally {
        isSyncingCloud = false;
      }
    }

    function compressImageFromFile(file, maxW = 800, maxH = 800) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxW || h > maxH) {
              const r = Math.min(maxW / w, maxH / h);
              w = Math.round(w * r);
              h = Math.round(h * r);
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.84));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function parseMessageTimestampMs(m) {
      if (!m) return 0;
      if (m.createdAt) {
        const t = Date.parse(m.createdAt);
        if (!Number.isNaN(t)) return t;
      }
      if (typeof m.id === "string") {
        const match = m.id.match(/^msg-(\d+)-/);
        if (match) return Number(match[1]) || 0;
      }
      return 0;
    }

    function getJoinedAtStorageKey(commId, userId) {
      return `alterhuman_joined_at_${commId}_${userId}`;
    }

    function getUserJoinedAt(commId, userId) {
      if (!commId || !userId) return null;
      const comm = state.communities.find((c) => c.id === commId);
      const member = comm && Array.isArray(comm.members)
        ? comm.members.find((m) => m.userId === userId)
        : null;
      if (member && member.joinedAt) {
        try { localStorage.setItem(getJoinedAtStorageKey(commId, userId), member.joinedAt); } catch {}
        return member.joinedAt;
      }
      try {
        const saved = localStorage.getItem(getJoinedAtStorageKey(commId, userId));
        if (saved) return saved;
      } catch {}
      return null;
    }

    function filterMessagesSinceJoinedAt(commId, userId, msgs) {
      if (!Array.isArray(msgs)) return [];
      const joinedAt = getUserJoinedAt(commId, userId);
      if (!joinedAt) return msgs;
      const joinedMs = Date.parse(joinedAt);
      if (Number.isNaN(joinedMs)) return msgs;
      return msgs.filter((m) => parseMessageTimestampMs(m) >= joinedMs);
    }

    function renderChatMessagesInnerHtml() {
      const comm = state.communities.find((c) => c.id === state.activeCommunityId);
      if (!comm || !state.currentUser) return "";
      const u = state.currentUser;
      const iAmAdmin = isSuperAdmin(u);
      const isOwner = comm.createdById === u.id || comm.createdBy === u.name || comm.createdBy === u.username;
      const activeCh = (comm.channels || []).find((ch) => ch.id === state.activeChannelId) || (comm.channels || [])[0];
      const channelMsgs = (state.messagesByComm[comm.id] || []).filter((m) => (m.channelId || "general") === activeCh.id);
      const allMsgs = filterMessagesSinceJoinedAt(comm.id, u.id, channelMsgs);
      const members = comm.members && comm.members.length > 0 ? comm.members : [{
        userId: u.id, username: u.username, name: u.name, pronouns: u.pronouns, avatarUrl: u.avatarUrl, role: "방장"
      }];

      const joinedNoticeBanner = `
        <div class="flex justify-center my-2">
          <span class="px-3 py-1 rounded-full text-[11px] font-medium bg-app-subtle border border-app text-app-muted">
            채팅방에 입장했습니다. 입장 이후의 대화만 표시됩니다.
          </span>
        </div>
      `;

      if (allMsgs.length === 0) {
        return `
          ${joinedNoticeBanner}
          <div class="h-[calc(100%-3rem)] flex flex-col items-center justify-center text-center p-8 text-app-muted space-y-1">

          </div>
        `;
      }

      return joinedNoticeBanner + allMsgs.map((msg) => {
        if (msg.isSystem) {
          return `<div class="flex justify-center my-2"><span class="px-3.5 py-1 rounded-full text-xs font-semibold badge-sand">${escapeHtml(msg.content)}</span></div>`;
        }
        const isMe = msg.senderId === u.id;
        const isSenderAdm = msg.senderRole === "관리자" || SUPER_ADMIN_IDENTIFIERS.includes((msg.senderName || "").trim().toLowerCase());
        const readUsers = msg.readUserIds || [msg.senderId];
        const unreadCnt = Math.max(0, members.filter((m) => !readUsers.includes(m.userId)).length);

        const textHtml = msg.content ? `<div class="whitespace-pre-wrap break-words">${escapeHtml(msg.content)}</div>` : "";
        const imgHtml = msg.attachmentUrl ? `<div class="${msg.content ? 'mt-2' : ''}"><img src="${msg.attachmentUrl}" onclick="state.lightboxImage = '${msg.attachmentUrl}'; render()" class="rounded-xl max-w-[240px] max-h-56 object-cover cursor-pointer border border-white/20" /></div>` : "";

        return `
          <div class="group flex items-start gap-3 ${isMe ? 'flex-row-reverse' : 'flex-row'}">
            <button onclick="openUserProfile('${msg.senderId}')" class="flex-shrink-0" title="프로필 보기">
              <img src="${msg.senderAvatar || AVATAR_PRESETS[0]}" class="w-9 h-9 rounded-xl bg-[#41566b] object-cover border border-app" />
            </button>
            <div class="flex flex-col max-w-[78%] sm:max-w-[68%] ${isMe ? 'items-end' : 'items-start'}">
              <div class="flex items-center gap-1.5 mb-1 flex-wrap ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                <button onclick="openUserProfile('${msg.senderId}')" class="font-bold text-xs text-app-main hover:underline">${escapeHtml(msg.senderName)}</button>
                ${msg.senderPronouns ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-medium badge-mauve">${escapeHtml(msg.senderPronouns)}</span>` : ""}
                ${isSenderAdm ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold badge-rose">최고 관리자</span>` : msg.senderRole === "방장" ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold badge-sand">방장</span>` : msg.senderRole ? `<span class="px-1.5 py-0.5 rounded text-[10px] font-bold badge-sage">${escapeHtml(msg.senderRole)}</span>` : ""}
                ${(isMe || isOwner || iAmAdmin) ? `<button onclick="deleteChatMessage('${comm.id}', '${msg.id}')" class="opacity-0 group-hover:opacity-100 px-1.5 py-0.5 rounded text-[10px] text-app-muted hover:text-app-main" title="메시지 삭제">삭제</button>` : ""}
                ${!isMe && !isSenderAdm ? `<button onclick="openReportModal('${comm.id}', '${msg.id}')" class="opacity-0 group-hover:opacity-100 px-1.5 py-0.5 rounded text-[10px] text-app-muted hover:text-app-main" title="신고">신고</button>` : ""}
              </div>

              <div class="flex items-end gap-1.5 ${isMe ? 'flex-row-reverse' : 'flex-row'}">
                <div class="px-3.5 py-2 rounded-2xl text-sm leading-snug shadow-sm ${isMe ? 'btn-ash font-medium rounded-tr-sm' : 'bg-app-surface text-app-main border border-app rounded-tl-sm'}">${textHtml}${imgHtml}</div>
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} text-[10px] flex-shrink-0">
                  ${unreadCnt > 0 ? `<span class="text-[#8c765c] dark:text-[#d9c3a5] font-bold text-[11px] leading-tight">${unreadCnt}</span>` : ""}
                  <span class="text-app-muted">${escapeHtml(msg.timestamp)}</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderChatMembersListInnerHtml() {
      const comm = state.communities.find((c) => c.id === state.activeCommunityId);
      if (!comm || !state.currentUser) return "";
      const u = state.currentUser;
      const iAmAdmin = isSuperAdmin(u);
      const isOwner = comm.createdById === u.id || comm.createdBy === u.name || comm.createdBy === u.username;
      const members = comm.members && comm.members.length > 0 ? comm.members : [{
        userId: u.id, username: u.username, name: u.name, pronouns: u.pronouns, avatarUrl: u.avatarUrl, role: "방장"
      }];

      return members.map((m) => {
        const isMe = m.userId === u.id;
        const isMemAdm = SUPER_ADMIN_IDENTIFIERS.includes((m.name || "").trim().toLowerCase()) || SUPER_ADMIN_IDENTIFIERS.includes((m.username || "").trim().toLowerCase());
        return `
          <div class="p-2 rounded-xl flex items-center justify-between gap-2 bg-app-subtle border border-app">
            <button onclick="openUserProfile('${m.userId}')" class="flex items-center gap-2 min-w-0 flex-1 text-left">
              <img src="${m.avatarUrl || AVATAR_PRESETS[0]}" class="w-8 h-8 rounded-lg object-cover shrink-0" />
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1 flex-wrap">
                  <p class="font-bold text-xs truncate text-app-main">${escapeHtml(m.name)}</p>
                  ${isMemAdm ? `<span class="text-[9px] font-bold badge-rose px-1.5 rounded">최고 관리자</span>` : m.role === "방장" ? `<span class="text-[9px] font-bold badge-sand px-1.5 rounded">방장</span>` : ""}

            <div class="flex items-center gap-1">

                <button onclick="openAdminBan('${m.userId}')" class="px-2 py-1 rounded badge-rose text-[10px] font-bold">제재</button>

          </div>

                <button onclick="state.activeChannelId = '${ch.id}'; render()" class="w-full px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-2 transition ${activeCh.id === ch.id ? 'btn-ash shadow-sm' : 'text-app-muted hover:bg-app-subtle'}">

                  <span class="truncate">${escapeHtml(ch.name)}</span>
                </button>

            </div>
          </div>

          <!-- 2. Main Chat Stream -->

                  <div class="flex items-center gap-1.5 text-[11px] text-app-muted">
                    <span class="truncate">#${escapeHtml(activeCh.name)}</span>
                    <span id="chat-header-member-count" class="shrink-0">· 접속 ${members.length}/${members.length}명</span>

                </div>
              </div>

              <div class="flex items-center flex-wrap gap-1.5 flex-shrink-0">
                ${iAmAdmin && !isOwner ? `
                  <button onclick="claimOwnership('${comm.id}')" class="px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold badge-rose transition">

                <button id="chat-btn-member-count" onclick="state.showMembersSidebar = !state.showMembersSidebar; render()" class="px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold border transition ${state.showMembersSidebar ? 'badge-mauve' : 'bg-app-subtle border-app text-app-main'}">
                  멤버 (${members.length})

                ${!isOwner ? `
                  <button onclick="leaveCommunityRoom('${comm.id}')" class="px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold border bg-app-subtle border-app text-app-muted hover:text-app-main transition">
                    나가기
                  </button>
                ` : ""}
                ${(isOwner || iAmAdmin) ? `
                  <button onclick="deleteCommunityConfirm('${comm.id}')" class="px-2.5 py-1.5 rounded-lg text-[11px] sm:text-xs font-bold badge-terra transition">

            <!-- Mobile Channel Switcher Bar -->
            <div class="lg:hidden px-3 py-1.5 bg-app-subtle border-b border-app flex items-center gap-1.5 overflow-x-auto shrink-0">
              ${(comm.channels || []).map((ch) => `
                <button onclick="state.activeChannelId = '${ch.id}'; render()" class="px-2.5 py-1 rounded-md text-[11px] font-bold whitespace-nowrap transition ${activeCh.id === ch.id ? 'btn-ash shadow-sm' : 'bg-app-surface text-app-muted border border-app'}">
                  # ${escapeHtml(ch.name)}
                </button>
              `).join("")}
            </div>

            ${state.showRulesPanel ? `
              <div class="bg-app-subtle border-b border-app px-4 sm:px-6 py-3.5">
                <div class="max-w-4xl mx-auto flex flex-col md:flex-row gap-4 justify-between">
                  <div class="space-y-1 flex-1">
                    <div class="text-xs font-bold text-app-main">커뮤니티 소개</div>
                    <p class="text-xs text-app-muted leading-relaxed">${escapeHtml(comm.description)}</p>
                  </div>
                  <div class="md:w-80 p-3 rounded-xl bg-app-surface border border-app space-y-1">
                    <div class="text-xs font-bold text-app-main">커뮤니티 이용 규칙</div>
                    <ul class="space-y-1 text-[11px] text-app-muted">
                      ${(comm.rules || []).map((r) => `<li>• ${escapeHtml(r)}</li>`).join("")}
                    </ul>
                  </div>
                </div>
              </div>
            ` : ""}

            <!-- Messages Stream -->
            <div id="chat-scroll-box" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 bg-app-canvas">
              ${renderChatMessagesInnerHtml()}
            </div>

            <!-- Input Bar (모바일 16px 폰트, z-index 최상단 보장, 100dvh 대응) -->
            <form onsubmit="handleSendChat(event)" class="p-2.5 sm:p-4 bg-app-surface border-t border-app relative z-30 pointer-events-auto shrink-0">
              ${state.chatPendingImage ? `
                <div class="mb-2 relative inline-block">
                  <img src="${state.chatPendingImage}" class="h-20 w-20 rounded-xl object-cover border border-[#5c7893]" />
                  <button type="button" onclick="state.chatPendingImage = ''; render()" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full btn-rose text-xs">✕</button>
                </div>
              ` : ""}

              <div class="flex items-center gap-2 min-w-0">
                <label class="px-3 py-2.5 rounded-xl badge-sage hover:opacity-90 cursor-pointer text-xs font-bold shrink-0 min-h-[42px] flex items-center justify-center" title="갤러리에서 사진 첨부">
                  사진
                  <input type="file" accept="image/*" onchange="handleChatImageUpload(event)" class="hidden" />
                </label>
                <input id="chat-msg-input" type="text" value="${escapeHtml(state.chatInputText)}" oninput="state.chatInputText = this.value" placeholder="#${escapeHtml(activeCh.name)}에 메시지 보내기..." class="flex-1 min-w-0 px-3.5 py-2.5 rounded-xl input-ash text-base sm:text-sm min-h-[42px] relative z-30 pointer-events-auto" />
                <button type="submit" class="px-4 py-2.5 rounded-xl btn-ash font-bold text-xs shadow-sm shrink-0 min-h-[42px]">전송</button>

            </form>

          ${state.showMembersSidebar ? `
            <div onclick="state.showMembersSidebar = false; render()" class="fixed inset-0 bg-black/50 z-30 md:hidden"></div>
            <aside class="fixed inset-y-0 right-0 z-40 w-72 md:static md:w-64 md:z-auto flex flex-col bg-app-surface border-l border-app p-4 overflow-y-auto flex-shrink-0 shadow-2xl md:shadow-none">
              <div class="text-[11px] font-bold uppercase tracking-wider text-app-muted mb-3 flex items-center justify-between">
                <span id="chat-sidebar-member-count">참여자 목록 (${members.length}명)</span>
                <button onclick="state.showMembersSidebar = false; render()" class="p-1.5 rounded-lg hover:bg-app-subtle">✕</button>
              </div>
              <div id="chat-members-list-box" class="space-y-2">
                ${renderChatMembersListInnerHtml()}
              </div>
            </aside>
          ` : ""}
        </div>
      `;

    function renderDmMessagesInnerHtml() {

      const convId = [u.id, target.id].sort().join("__");
      const dms = state.dms[convId] || [];

      if (dms.length === 0) {
        return `
          <div class="h-full flex flex-col items-center justify-center text-center p-8 text-app-muted space-y-1">
            <p class="font-bold text-sm text-app-main">${escapeHtml(target.name)} 님과의 첫 1:1 대화입니다.</p>
            <p class="text-xs">메시지를 보내 대화를 시작해 보세요.</p>
          </div>
        `;
      }

      return dms.map((m) => {
        const isMe = m.senderId === u.id;
        return `
          <div class="flex items-start gap-2.5 ${isMe ? 'flex-row-reverse' : 'flex-row'}">
            <div class="px-3.5 py-2 rounded-2xl text-sm leading-snug max-w-[75%] shadow-sm ${isMe ? 'btn-ash font-medium rounded-tr-sm' : 'bg-app-surface border border-app text-app-main rounded-tl-sm'}"><div class="whitespace-pre-wrap break-words">${escapeHtml(m.content)}</div></div>
            <span class="text-[10px] text-app-muted self-end">${escapeHtml(m.timestamp)}</span>
          </div>
        `;
      }).join("");
    }

                <div class="min-w-0">

            <button type="submit" class="px-4 py-2.5 rounded-xl btn-ash font-bold text-xs shadow-sm shrink-0 min-h-[42px]">전송</button>
          </form>
        </div>
      `;
    }

    function renderWikiEntriesHtml() {
      const entries = ALTERHUMAN_WIKI_ENTRIES.filter((e) => {
        const matchCat = state.wikiCategory === "전체" || e.category === state.wikiCategory;
        const q = state.wikiSearch.trim().toLowerCase();
        const matchQ = !q || e.termKo.toLowerCase().includes(q) || e.termEn.toLowerCase().includes(q) || e.summary.toLowerCase().includes(q) || e.details.some((d) => d.toLowerCase().includes(q));
        return matchCat && matchQ;
      });
      return entries.map((e) => `
        <div class="p-4 rounded-xl bg-app-subtle border border-app space-y-2">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div class="flex flex-wrap items-center gap-2">
              <span class="px-2 py-0.5 rounded text-[11px] font-bold ${e.badgeClass || 'badge-ash'}">${escapeHtml(e.badge)}</span>
              <h3 class="font-bold text-sm sm:text-base text-app-main">${escapeHtml(e.termKo)}</h3>
              <span class="text-xs font-mono text-app-muted">(${escapeHtml(e.termEn)})</span>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded badge-sand">${escapeHtml(e.category)}</span>
          </div>
          <p class="text-xs sm:text-sm font-semibold leading-relaxed text-app-main">${escapeHtml(e.summary)}</p>
          <ul class="space-y-1 pt-1 border-t border-app text-xs text-app-muted">
            ${e.details.map((d) => `<li>• ${escapeHtml(d)}</li>`).join("")}
          </ul>
        </div>
      `).join("");
    }

            <div class="px-6 py-4 border-b border-app flex items-center justify-between hero-multitone-card">

      if (!state.isDrawerOpen || !state.currentUser) return "";
      const u = state.currentUser;
      const counts = getFollowCounts(u.id);
      const joinedComms = state.communities.filter((c) => state.joinedCommunityIds.includes(c.id));

    async function saveInquiryBackupToDb(inquiry) {
      try {
        const localList = loadStorage(STORAGE_KEYS.INQUIRIES, []);
        const mergedLocal = [inquiry, ...(Array.isArray(localList) ? localList.filter((x) => x && x.id !== inquiry.id) : [])].slice(0, 200);
        state.inquiries = mergedLocal;
        saveStorage(STORAGE_KEYS.INQUIRIES, mergedLocal);

        const cloudList = await cloudGet(CLOUD_KEYS.INQUIRIES, []);
        const map = new Map();
        for (const item of [...mergedLocal, ...(Array.isArray(cloudList) ? cloudList : [])]) {
          if (item && item.id) map.set(item.id, item);
        }
        const mergedCloud = Array.from(map.values())
          .sort((a, b) => new Date(b.createdAt || 0).getTime() - new Date(a.createdAt || 0).getTime())
          .slice(0, 200);
        state.inquiries = mergedCloud;
        saveStorage(STORAGE_KEYS.INQUIRIES, mergedCloud);
        await cloudPut(CLOUD_KEYS.INQUIRIES, mergedCloud);
        return true;
      } catch (err) {
        console.error("[Support DB Backup Error]", err);
        return false;
      }
    }

    window.handleSubmitSupport = async function(e) {
      e.preventDefault();
      const category = document.getElementById("support-category")?.value || "문의";
      const replyEmail = document.getElementById("support-reply-email")?.value.trim() || "";
      const title = document.getElementById("support-title")?.value.trim() || "";
      const content = document.getElementById("support-content")?.value.trim() || "";
      if (!title || !content) return;

      const u = state.currentUser;
      const senderInfo = u ? `${u.name} (@${u.displayId || u.username}) [${u.pronouns || ""}]` : "비로그인 방문자";
      const inquiry = {
        id: "inq-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        category,
        replyEmail,
        title,
        content,
        senderInfo,
        createdAt: new Date().toISOString()
      };

      state.supportSending = true;
      state.supportFeedback = null;
      render();

      // 1. 안전장치: 메일 발송 실패 시에도 신고 내역이 유실되지 않도록 DB에 무조건 먼저 백업 저장
      const dbSaved = await saveInquiryBackupToDb(inquiry);

      try {
        const useBackend = !!SUPPORT_MAIL_CONFIG.BACKEND_API_URL;
        const endpoint = useBackend ? SUPPORT_MAIL_CONFIG.BACKEND_API_URL : SUPPORT_MAIL_CONFIG.FORMSUBMIT_AJAX_URL;
        const payload = useBackend
          ? {
              id: inquiry.id,
              to: SUPPORT_MAIL_CONFIG.ADMIN_EMAIL,
              category,
              replyEmail,
              title,
              content,
              senderInfo,
              createdAt: inquiry.createdAt
            }
          : {
              _subject: `[알터휴먼 라운지 ${category}] ${title}`,
              _template: "table",
              _captcha: "false",
              접수번호: inquiry.id,
              보낸사람: senderInfo,
              답변이메일: replyEmail || "미입력",
              문의유형: category,
              제목: title,
              내용: content
            };

        const res = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.success === "false" || data.success === false || data.ok === false) {
          console.error("[Support Mail Dispatch Error]", {
            endpoint,
            status: res.status,
            responseData: data,
            adminEmail: SUPPORT_MAIL_CONFIG.ADMIN_EMAIL
          });
          throw new Error(data.message || data.error || `HTTP ${res.status}`);
        }

        state.supportSending = false;
        state.supportFeedback = {
          ok: true,
          message: `DB 백업 및 관리자 메일(${SUPPORT_MAIL_CONFIG.ADMIN_EMAIL}) 발송 요청이 완료되었습니다.`
        };
        render();
        setTimeout(() => {
          state.isSupportModalOpen = false;
          state.supportFeedback = null;
          render();
        }, 1800);
      } catch (err) {
        console.error("[Support Mail Exception]", {
          errorMessage: err.message,
          dbSaved,
          adminEmail: SUPPORT_MAIL_CONFIG.ADMIN_EMAIL,
          stack: err.stack
        });
        state.supportSending = false;
        state.supportFeedback = {
          ok: false,
          message: dbSaved
            ? `문의 내용은 DB(관리자 접수함)에 안전하게 저장되었으나, 이메일 전송 중 오류가 발생했습니다: ${err.message}`
            : `메일 발송에 실패했습니다: ${err.message}`
        };
        render();
      }
    };

    window.leaveCommunityRoom = async function(commId) {
      const comm = state.communities.find((c) => c.id === commId);
      if (!comm || !state.currentUser) return;
      const uid = state.currentUser.id;
      if (!confirm(`"${comm.name}" 채팅방에서 나가시겠습니까? 다시 입장하면 이후 대화부터만 표시됩니다.`)) return;

      comm.members = (comm.members || []).filter((m) => m.userId !== uid);
      comm.memberCount = comm.members.length;
      state.joinedCommunityIds = state.joinedCommunityIds.filter((id) => id !== commId);
      try { localStorage.removeItem(getJoinedAtStorageKey(commId, uid)); } catch {}
      saveStorage(STORAGE_KEYS.COMMUNITIES, state.communities);
      saveStorage(STORAGE_KEYS.JOINED, state.joinedCommunityIds);

      if (state.activeCommunityId === commId) {
        roomSocket.leaveRoom();
        state.activeCommunityId = null;
      }
      render();

      try {
        await fetch(`${SUPPORT_API_BASE}/api/rooms/${encodeURIComponent(commId)}/leave`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: uid })
        });
      } catch {}
      broadcastEvent("COMMUNITY_UPDATED", comm);
      await cloudSaveCommunities();
    };

    window.enterCommunity = async function(commId) {
      const comm = state.communities.find((c) => c.id === commId);
      if (!comm || !state.currentUser) return;
      if ((comm.kickedUserIds || []).includes(state.currentUser.id)) {
        alert("해당 커뮤니티에서 강퇴된 계정이므로 입장할 수 없습니다.");
        return;
      }
      if (!state.joinedCommunityIds.includes(commId)) {
        state.joinedCommunityIds.push(commId);
        saveStorage(STORAGE_KEYS.JOINED, state.joinedCommunityIds);
      }
      const members = comm.members || [];
      let memberAdded = false;
      const existingMember = members.find((m) => m.userId === state.currentUser.id);
      if (!existingMember) {
        const joinedAt = new Date().toISOString();
        members.push({
          userId: state.currentUser.id,
          username: state.currentUser.username,
          name: state.currentUser.name,
          pronouns: state.currentUser.pronouns,
          avatarUrl: state.currentUser.avatarUrl,
          role: comm.createdById === state.currentUser.id ? "방장" : "멤버",
          joinedAt
        });
        comm.members = members;
        comm.memberCount = members.length;
        try { localStorage.setItem(getJoinedAtStorageKey(commId, state.currentUser.id), joinedAt); } catch {}
        saveStorage(STORAGE_KEYS.COMMUNITIES, state.communities);
        memberAdded = true;
      } else if (!existingMember.joinedAt) {
        let savedJoinedAt = null;
        try { savedJoinedAt = localStorage.getItem(getJoinedAtStorageKey(commId, state.currentUser.id)); } catch {}
        existingMember.joinedAt = savedJoinedAt || new Date().toISOString();
        try { localStorage.setItem(getJoinedAtStorageKey(commId, state.currentUser.id), existingMember.joinedAt); } catch {}
        saveStorage(STORAGE_KEYS.COMMUNITIES, state.communities);
        memberAdded = true;
      }

      const activeJoinedAt = getUserJoinedAt(commId, state.currentUser.id);
      state.activeDmUser = null;
      state.activeCommunityId = commId;
      state.activeChannelId = (comm.channels && comm.channels[0]) ? comm.channels[0].id : "general";
      // 방 단위 WebSocket 토픽 구독 (해당 방에 입장한 유저에게만 실시간 메시지 브로드캐스트)
      roomSocket.joinRoom(commId);

      // 방 입장 시 입장 시점(joined_at) 이후 메시지만 읽음 처리 및 화면 렌더링 대상으로 필터링
      const existingRoomMsgs = state.messagesByComm[commId] || [];
      const filteredRoomMsgs = filterMessagesSinceJoinedAt(commId, state.currentUser.id, existingRoomMsgs);
      let readChanged = false;
      filteredRoomMsgs.forEach((m) => {
        if (!Array.isArray(m.readUserIds)) m.readUserIds = [m.senderId];
        if (!m.readUserIds.includes(state.currentUser.id)) {
          m.readUserIds.push(state.currentUser.id);
          readChanged = true;
        }
      });
      if (readChanged) {
        saveStorage(STORAGE_KEYS.MESSAGES, state.messagesByComm);
      }

      render();
      setTimeout(() => {
        const box = document.getElementById("chat-scroll-box");
        if (box) box.scrollTop = box.scrollHeight;
      }, 20);

      try {
        await fetch(`${SUPPORT_API_BASE}/api/rooms/${encodeURIComponent(commId)}/join`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: state.currentUser.id, joinedAt: activeJoinedAt })
        });
      } catch {}

      if (memberAdded) {
        broadcastEvent("COMMUNITY_UPDATED", comm);
        await cloudSaveCommunities();
      }
      if (readChanged && existingRoomMsgs.length > 0) {
        await cloudSaveRoomMessages(commId, existingRoomMsgs);
      }
      safeReactiveRender(true);
    };

      if (!state.dms[convId]) state.dms[convId] = [];
      const dmMsg = {
        id: "dm-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        senderId: state.currentUser.id,
        senderName: state.currentUser.name,
        content: filterProfanity(inp.value.trim()),
        timestamp: formatKoreanTime(),
        createdAt: new Date().toISOString()
      };
      state.dms[convId].push(dmMsg);
      saveStorage(STORAGE_KEYS.DMS, state.dms);
      broadcastEvent("NEW_DM", { convId, message: dmMsg });
      render();
      const dmInp = document.getElementById("dm-msg-input");
      if (dmInp) dmInp.focus();
      await cloudPut(CLOUD_KEYS.DMS, state.dms);
    };

    window.handlePostImageUpload = async function(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      state.newPostImage = await compressImageFromFile(file, 700, 700);
      render();
    };

    window.handleCreatePost = function(e) {
      e.preventDefault();
      const u = state.currentUser;
      if (!u || (!state.newPostContent.trim() && !state.newPostImage)) return;
      state.posts.unshift({
        id: "post-" + Date.now() + "-" + Math.random().toString(36).slice(2, 6),
        authorId: u.id,
        authorName: u.name,
        authorAvatar: u.avatarUrl,
        authorPronouns: u.pronouns,
        content: filterProfanity(state.newPostContent.trim()),
        mediaUrl: state.newPostImage || undefined,
        likes: [],
        comments: [],
        createdAt: new Date().toISOString()
      });
      saveStorage(STORAGE_KEYS.POSTS, state.posts);
      cloudPut(CLOUD_KEYS.POSTS, state.posts);
      broadcastEvent("POST_UPDATED", state.posts);
      state.newPostContent = "";
      state.newPostImage = "";
      render();
    };

    window.toggleLikePost = function(postId) {
      const p = state.posts.find((x) => x.id === postId);
      if (!p || !state.currentUser) return;
      if (!p.likes) p.likes = [];
      if (p.likes.includes(state.currentUser.id)) {
        p.likes = p.likes.filter((id) => id !== state.currentUser.id);
      } else {
        p.likes.push(state.currentUser.id);
      }
      saveStorage(STORAGE_KEYS.POSTS, state.posts);
      cloudPut(CLOUD_KEYS.POSTS, state.posts);
      broadcastEvent("POST_UPDATED", state.posts);
      render();
    };

    window.deletePost = function(postId) {
      state.posts = state.posts.filter((p) => p.id !== postId);
      saveStorage(STORAGE_KEYS.POSTS, state.posts);
      cloudPut(CLOUD_KEYS.POSTS, state.posts);
      broadcastEvent("POST_UPDATED", state.posts);
      render();
    };

    window.handleSaveProfile = function(e) {
      e.preventDefault();
      const u = state.currentUser;
      if (!u) return;
      u.name = document.getElementById("prof-name").value.trim() || u.name;
      u.pronouns = document.getElementById("prof-pronouns").value.trim() || u.pronouns;
      u.statusMessage = document.getElementById("prof-status").value.trim();
      u.bio = document.getElementById("prof-bio").value.trim();
      state.usersDir[u.username] = u;
      saveActiveSession(u);
      saveStorage(STORAGE_KEYS.USERS_DIR, state.usersDir);
      cloudPut(CLOUD_KEYS.USERS, state.usersDir);
      broadcastEvent("USER_UPDATED", u);
      state.isProfileModalOpen = false;
      render();
    };

    window.openReportModal = function(commId, msgId) {
      const msg = (state.messagesByComm[commId] || []).find((m) => m.id === msgId);
      if (msg) {
        state.reportingMessage = msg;
        state.reportVerdict = null;
        render();
      }
    };

    window.executeAiReport = function() {
      if (!state.reportingMessage) return;
      state.reportVerdict = analyzeMessageForReport(state.reportingMessage.content, "");
      render();
    };

    window.openAdminBan = function(userId) {
      const found = findUserById(userId);
      if (found) {
        state.adminBanningUser = found;
        render();
      }
    };

    window.applyAdminBan = function(userId) {
      const days = parseInt(document.getElementById("admin-ban-days")?.value || "7", 10) || 7;
      const reason = document.getElementById("admin-ban-reason")?.value || "운영 원칙 위반";
      const bannedUntil = new Date(Date.now() + days * 86400000).toISOString();
      for (const [k, u] of Object.entries(state.usersDir)) {
        if (u.id === userId || u.username === userId) {
          u.bannedUntil = bannedUntil;
          u.banReason = reason;
        }
      }
      saveStorage(STORAGE_KEYS.USERS_DIR, state.usersDir);
      cloudPut(CLOUD_KEYS.USERS, state.usersDir);
      broadcastEvent("USER_UPDATED", state.usersDir);
      alert(`[${state.adminBanningUser.name}] 유저에게 ${days}일 활동 정지 제재가 적용되었습니다.`);
      state.adminBanningUser = null;
      render();
    };

    window.applyAdminUnban = function(userId) {
      for (const [k, u] of Object.entries(state.usersDir)) {
        if (u.id === userId || u.username === userId) {
          delete u.bannedUntil;
          delete u.banReason;
        }
      }
      saveStorage(STORAGE_KEYS.USERS_DIR, state.usersDir);
      cloudPut(CLOUD_KEYS.USERS, state.usersDir);
      broadcastEvent("USER_UPDATED", state.usersDir);
      alert("활동 제한이 즉시 해제되었습니다.");
      state.adminBanningUser = null;
      render();
    };

    function render() {
      const root = document.getElementById("app");
      if (!state.currentUser) {
        root.innerHTML = renderAuthOnboarding() + renderWikiModal();
        return;
      }

      let mainView = "";
      if (state.activeDmUser) {
        mainView = renderDmRoom();
      } else if (state.activeCommunityId) {
        mainView = renderChatRoom();
      } else {
        mainView = renderLobby();
      }

      root.innerHTML = `
        ${renderTopNav()}
        ${renderHamburgerDrawer()}
        <main class="flex-1 flex overflow-hidden">${mainView}</main>
        ${renderWikiModal()}
        ${renderCreateCommunityModal()}
        ${renderUserProfileDetailModal()}
        ${renderProfileSettingsModal()}
        ${renderDmDrawer()}
        ${renderReportModal()}
        ${renderSupportModal()}
        ${renderAdminBanModal()}
        ${renderLightbox()}
      `;
    }

    render();
    syncWithCloud();
    // 1.5초 주기로 클라우드 실시간 동기화 + 창 포커스 시 즉시 동기화
    setInterval(syncWithCloud, 1500);
    window.addEventListener("focus", syncWithCloud);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) syncWithCloud();
    });

    // 모바일 가상 키보드 올라올 때 동적 뷰포트 높이(visualViewport) 동기화 및 채팅 스크롤 유지
    if (window.visualViewport) {
      const syncViewportHeight = () => {
        const appEl = document.getElementById("app");
        if (appEl && window.visualViewport) {
          appEl.style.height = window.visualViewport.height + "px";
        }
        const chatBox = document.getElementById("chat-scroll-box");
        if (chatBox && document.activeElement && document.activeElement.id === "chat-msg-input") {
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      };
      window.visualViewport.addEventListener("resize", syncViewportHeight);
    }
  </script>
</body>
</html>
